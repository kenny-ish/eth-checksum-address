[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eth-checksum-address"
version = "0.2.0"
description = "EIP-55 checksum encoder/validator for Ethereum addresses with a pure-Python Keccak-256"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kenny-ish" }]
keywords = ["ethereum", "eip-55", "checksum", "address", "keccak"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/kenny-ish/eth-checksum-address"
Changelog = "https://github.com/kenny-ish/eth-checksum-address/blob/main/CHANGELOG.md"

[project.scripts]
eip55 = "eip55:main"

[tool.setuptools]
py-modules = ["eip55", "keccak"]
